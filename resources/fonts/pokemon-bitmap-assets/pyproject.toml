[project]
name = "fonts"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Karn Wong", email = "karn@karnwong.me" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.0.0",
    "rectpack>=0.2.2",
]

[project.scripts]
